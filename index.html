<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="img/favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="img/favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="img/favicon_io/favicon-16x16.png"
    />
    <link rel="manifest" href="img/favicon_io/site.webmanifest" />
    <title>Ikhsan's Notes</title>
  </head>
  <body>
    <div class="container">
      <div class="terminal">
        <!-- header -->
        <header class="terminal__header">
          <a href="index.html" class="terminal__title">
            <img class="terminal__logo" src="img/icon.svg" alt="MTB logo" />
            Ikhsan's Notes</a
          >

          <div></div>
          <div class="terminal__tool">O</div>
        </header>
        <!-- site description -->
        <div class="terminal__description">
          Blog pribadi tentang pemrograman, proyek, kuliah, Linux, dan hal-hal
          yang sedang saya pelajari.
        </div>

        <!-- body -->
        <main class="terminal__body">
          <div class="terminal__posts">
            <!-- post lists -->
            <a href="post.html" class="post__item">
              <div class="post__title">Jenis-jenis jaringan komputer</div>
              <div class="post__description">
                Penjelasan tentang LAN, MAN, WAN, dan Internet
              </div>
            </a>
            <div class="post__item">
              <div class="post__title">2</div>
              <div class="post__description">2</div>
            </div>
            <div class="post__item">
              <div class="post__title">3</div>
              <div class="post__description">3</div>
            </div>
            <div class="post__item">
              <div class="post__title">4</div>
              <div class="post__description">4</div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="mouse-guide mouse-guide--horizontal"></div>
    <div class="mouse-guide mouse-guide--vertical"></div>

    <script>
      const grid = document.querySelector(".terminal__posts");
      const posts = [...grid.querySelectorAll(".post__item:not(.post--empty)")];

      function fillGrid() {
        grid.querySelectorAll(".post--empty").forEach((el) => el.remove());

        const width = window.innerWidth;

        let columns;

        if (width >= 1200) {
          columns = 5;
        } else if (width >= 768) {
          columns = 3;
        } else if (width >= 480) {
          columns = 2;
        } else {
          columns = 1;
        }

        const remainder = posts.length % columns;

        if (remainder !== 0) {
          const emptyCount = columns - remainder;

          for (let i = 0; i < emptyCount; i++) {
            const empty = document.createElement("div");
            empty.className = "post__item post--empty";
            grid.appendChild(empty);
          }
        }
      }

      fillGrid();
      window.addEventListener("resize", fillGrid);
    </script>

    <script>
      const horizontalGuide = document.querySelector(
        ".mouse-guide--horizontal",
      );

      const verticalGuide = document.querySelector(".mouse-guide--vertical");

      window.addEventListener("mousemove", (event) => {
        horizontalGuide.style.top = `${event.clientY}px`;
        verticalGuide.style.left = `${event.clientX}px`;
      });
    </script>
  </body>
</html>
